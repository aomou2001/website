<p>横にスワイプして広角映像の視界を動かし、「振り返る」で反対側の映像に切り替える実験。画面位置に応じて左右の音を混ぜ、モノラルで出力した。</p>
<p>2026年10月21日にアーカイブ、削除。動画6本・音声6本と実験用プログラム、制作ファイルは、サイト容量削減のため公開を終了しました。</p>
